
spring:
  application:
    name: digital-banking

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/digital_banking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8082}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

logging:
  level:
    org.springframework.security: INFO
